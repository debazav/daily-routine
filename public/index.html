<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Rotina Diária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Controle de Rotina Diária</h1>
            <p>Selecione um dia da semana para gerenciar suas rotinas</p>
        </header>

        <main class="days-grid">
            <div class="day-card" data-day="monday">
                <div class="day-icon">📅</div>
                <h2>Segunda-feira</h2>
                <p class="day-count">0 rotinas</p>
            </div>

            <div class="day-card" data-day="tuesday">
                <div class="day-icon">📊</div>
                <h2>Terça-feira</h2>
                <p class="day-count">0 rotinas</p>
            </div>

            <div class="day-card" data-day="wednesday">
                <div class="day-icon">🎯</div>
                <h2>Quarta-feira</h2>
                <p class="day-count">0 rotinas</p>
            </div>

            <div class="day-card" data-day="thursday">
                <div class="day-icon">⚡</div>
                <h2>Quinta-feira</h2>
                <p class="day-count">0 rotinas</p>
            </div>

            <div class="day-card" data-day="friday">
                <div class="day-icon">🎉</div>
                <h2>Sexta-feira</h2>
                <p class="day-count">0 rotinas</p>
            </div>

            <div class="day-card" data-day="saturday">
                <div class="day-icon">🌅</div>
                <h2>Sábado</h2>
                <p class="day-count">0 rotinas</p>
            </div>

            <div class="day-card" data-day="sunday">
                <div class="day-icon">✨</div>
                <h2>Domingo</h2>
                <p class="day-count">0 rotinas</p>
            </div>
        </main>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
